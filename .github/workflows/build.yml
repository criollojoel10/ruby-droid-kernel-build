name: Build Kernel (KSU + Droidspaces)
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: KSU branch
        default: next

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl ca-certificates python3 build-essential bc bison flex libssl-dev libelf-dev dwarves cpio kmod wget gzip xz-utils clang lld llvm ccache

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: RubyxLabs/android_kernel_xiaomi_mt6877
          ref: lineage-24.0
          path: kernel

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Setup KSU-Next
        working-directory: kernel
        run: |
          set -euxo pipefail
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash

      - name: Apply Droidspaces kABI patch
        working-directory: kernel
        run: |
          set -euxo pipefail
          curl -LSs -o /tmp/ds.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          patch -p1 < /tmp/ds.patch

      - name: Fix missing headers
        working-directory: kernel
        run: |
          set -euxo pipefail
          mkdir -p drivers/misc/mediatek/adsp/include sound/soc/mediatek/audio_dsp/v2
          echo '#ifndef ADSP_HELPER_H' > drivers/misc/mediatek/adsp/include/adsp_helper.h
          echo '#define ADSP_HELPER_H' >> drivers/misc/mediatek/adsp/include/adsp_helper.h
          echo '#endif' >> drivers/misc/mediatek/adsp/include/adsp_helper.h
          cp -f drivers/misc/mediatek/adsp/include/adsp_helper.h drivers/misc/mediatek/adsp/common_v2/adsp_helper.h 2>/dev/null || true
          find drivers/misc/mediatek -name 'adsp_helper.h' -not -path '*/adsp/common_v2/*' | xargs -I{} cp -f {} drivers/misc/mediatek/adsp/common_v2/ 2>/dev/null || true
          find drivers/misc/mediatek -name 'mtk-dsp-mem-control.h' -exec cp -f {} drivers/misc/mediatek/adsp/common_v2/ \; 2>/dev/null || true
          find drivers/misc/mediatek -name 'mtk-base-dsp.h' -exec cp -f {} sound/soc/mediatek/audio_dsp/v2/ \; 2>/dev/null || true
          find drivers/misc/mediatek -name 'mtk-dsp-common.h' -exec cp -f {} sound/soc/mediatek/audio_dsp/v2/ \; 2>/dev/null || true
          find . -name 'adsp_helper.h' -not -path '*/adsp/common_v2/*' | xargs -I{} sh -c 'grep -rl "#include.*adsp_helper" drivers/misc/mediatek/adsp/common_v2 2>/dev/null | xargs -I$ sed -i "s|#include.*adsp_helper.h|#include \"adsp_helper.h\"|g" $' 2>/dev/null || true
          find sound/soc/mediatek/audio_dsp/v2 -name '*.c' -o -name '*.h' | xargs -I{} sed -i 's|#include <mtk-base-dsp.h>|#include "mtk-base-dsp.h"|g' {} 2>/dev/null || true
          find sound/soc/mediatek/audio_dsp/v2 -name '*.c' -o -name '*.h' | xargs -I{} sed -i 's|#include <mtk-dsp-common.h>|#include "mtk-dsp-common.h"|g' {} 2>/dev/null || true

      - name: Configure and build
        working-directory: kernel
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export LLVM=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CCACHE_DIR=/home/runner/.ccache
          ccache -M 2G || true
          export CC="ccache clang"
          export HOSTCC="ccache gcc"
          DEFCONFIG=arch/arm64/configs/ruby_defconfig
          for opt in CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_PID_NS CONFIG_DEVTMPFS CONFIG_USER_NS CONFIG_UTS_NS CONFIG_SECCOMP CONFIG_SECCOMP_FILTER CONFIG_MEMCG CONFIG_MEMCG_SWAP CONFIG_OVERLAY_FS CONFIG_NET_NS CONFIG_VETH CONFIG_BRIDGE CONFIG_TUN CONFIG_KSU CONFIG_FUSE_FS CONFIG_BLK_DEV_LOOP CONFIG_EXT4_FS CONFIG_IPV6 CONFIG_MACVLAN CONFIG_NETFILTER_XT_MATCH_ADDRTYPE CONFIG_IP6_NF_NAT CONFIG_IP6_NF_TARGET_MASQUERADE CONFIG_NETFILTER_XT_TARGET_REJECT CONFIG_NETFILTER_XT_TARGET_LOG CONFIG_NETFILTER_XT_MATCH_RECENT CONFIG_IP_SET CONFIG_IP_SET_HASH_IP CONFIG_IP_SET_HASH_NET CONFIG_NETFILTER_XT_SET CONFIG_TMPFS_POSIX_ACL CONFIG_TMPFS_XATTR; do
            sed -i "s|# $opt is not set|$opt=y|" "$DEFCONFIG"
            grep -q "^$opt=" "$DEFCONFIG" || echo "$opt=y" >> "$DEFCONFIG"
          done
          make ruby_defconfig
          make -j$(nproc) CC="$CC" HOSTCC="$HOSTCC" Image

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/arch/arm64/boot/Image
