name: Build Kernel (KSU + Droidspaces)
'on':
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: KSU branch
        default: next

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             git curl ca-certificates python3 build-essential bc bison flex             libssl-dev libelf-dev dwarves cpio kmod wget gzip xz-utils clang lld llvm ccache
          clang --version
          make --version | head -1

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: RubyxLabs/android_kernel_xiaomi_mt6877
          ref: lineage-24.0
          path: kernel

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Setup KSU-Next
        working-directory: kernel
        run: |
          set -euxo pipefail
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash

      - name: Apply Droidspaces kABI patch
        working-directory: kernel
        run: |
          set -euxo pipefail
          curl -LSs -o /tmp/ds.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          patch -p1 < /tmp/ds.patch

      - name: Configure Droidspaces + KSU
        working-directory: kernel
        run: |
          set -euxo pipefail
          cp drivers/misc/mediatek/adsp/include/adsp_helper.h drivers/misc/mediatek/adsp/common_v2/adsp_helper.h
          cp sound/soc/mediatek/audio_dsp/mtk-dsp-mem-control.h sound/soc/mediatek/audio_dsp/v2/mtk-dsp-mem-control.h
          cp sound/soc/mediatek/audio_dsp/mtk-base-dsp.h sound/soc/mediatek/audio_dsp/v2/mtk-base-dsp.h
          cp sound/soc/mediatek/audio_dsp/mtk-dsp-common.h sound/soc/mediatek/audio_dsp/v2/mtk-dsp-common.h
          sed -i 's/#include <adsp_helper.h>/#include "adsp_helper.h"/' drivers/misc/mediatek/adsp/common_v2/adsp_core.h
          sed -i 's/#include <mtk-dsp-mem-control.h>/#include "mtk-dsp-mem-control.h"/' sound/soc/mediatek/audio_dsp/v2/mtk-dsp-common.c
          sed -i 's/#include <mtk-base-dsp.h>/#include "mtk-base-dsp.h"/' sound/soc/mediatek/audio_dsp/v2/mtk-dsp-common.c
          sed -i 's/#include <mtk-dsp-common.h>/#include "mtk-dsp-common.h"/' sound/soc/mediatek/audio_dsp/v2/mtk-dsp-common.c
          echo "=== adsp_core.h ==="
          grep -n 'adsp_helper' drivers/misc/mediatek/adsp/common_v2/adsp_core.h
          echo "=== audio_dsp ==="
          grep -n 'mtk-dsp|mtk-base-dsp' sound/soc/mediatek/audio_dsp/v2/mtk-dsp-common.c
          DEFCONFIG=arch/arm64/configs/ruby_defconfig
          sed -i 's/# CONFIG_SYSVIPC is not set/CONFIG_SYSVIPC=y/'           sed -i 's/# CONFIG_POSIX_MQUEUE is not set/CONFIG_POSIX_MQUEUE=y/'           sed -i 's/# CONFIG_IPC_NS is not set/CONFIG_IPC_NS=y/'           sed -i 's/# CONFIG_PID_NS is not set/CONFIG_PID_NS=y/'           sed -i 's/# CONFIG_DEVTMPFS is not set/CONFIG_DEVTMPFS=y/'           sed -i 's/# CONFIG_USER_NS is not set/CONFIG_USER_NS=y/'           sed -i 's/# CONFIG_UTS_NS is not set/CONFIG_UTS_NS=y/'           sed -i 's/# CONFIG_SECCOMP is not set/CONFIG_SECCOMP=y/'           sed -i 's/# CONFIG_SECCOMP_FILTER is not set/CONFIG_SECCOMP_FILTER=y/'           sed -i 's/# CONFIG_MEMCG is not set/CONFIG_MEMCG=y/'           sed -i 's/# CONFIG_MEMCG_SWAP is not set/CONFIG_MEMCG_SWAP=y/'           sed -i 's/# CONFIG_OVERLAY_FS is not set/CONFIG_OVERLAY_FS=y/'           sed -i 's/# CONFIG_NET_NS is not set/CONFIG_NET_NS=y/'           sed -i 's/# CONFIG_VETH is not set/CONFIG_VETH=y/'           sed -i 's/# CONFIG_BRIDGE is not set/CONFIG_BRIDGE=y/'           sed -i 's/# CONFIG_TUN is not set/CONFIG_TUN=y/'           sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/'           sed -i 's/# CONFIG_FUSE_FS is not set/CONFIG_FUSE_FS=y/'           sed -i 's/# CONFIG_BLK_DEV_LOOP is not set/CONFIG_BLK_DEV_LOOP=y/'           sed -i 's/# CONFIG_EXT4_FS is not set/CONFIG_EXT4_FS=y/'           sed -i 's/# CONFIG_IPV6 is not set/CONFIG_IPV6=y/'           sed -i 's/# CONFIG_MACVLAN is not set/CONFIG_MACVLAN=y/'           echo "Defconfig patched"

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export LLVM=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CCACHE_DIR=/home/joel/.ccache
          ccache -M 2G || true
          export CC="ccache clang"
          export HOSTCC="ccache gcc"
          make ruby_defconfig
          make -j2 CC="$CC" HOSTCC="$HOSTCC" Image

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/arch/arm64/boot/Image
