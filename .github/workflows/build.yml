name: Build Kernel (KSU-Next + DroidSpaces)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'RubyxLabs/android_kernel_xiaomi_mt6877 ref (pinned to the ROM commit for vermagic parity)'
        default: 'be1aa8ecec91d1793024db1d7a88e621b74e633e'
        required: true
      ksu_ref:
        description: 'KernelSU-Next commit/tag (empty = latest tag)'
        default: ''
        required: false
      audiodsp:
        description: 'Build MTK audiodsp code (published tree lacks mtk-base-afe.h/audio_type.h/dvfs.h)'
        type: choice
        options: ['false', 'true']
        default: 'false'
      kabi_slots:
        description: 'DroidSpaces SYSVIPC kABI slot variant (auto = try 6_7_8, 3_4_5, 1_2_3)'
        default: 'auto'
        required: true
      localversion:
        description: 'CONFIG_LOCALVERSION suffix (empty = kernel default)'
        default: ''
        required: false
      expected_release:
        description: 'Required kernel release string (vermagic prefix)'
        default: '6.6.143-android15-8-4k-Singularity-gbe1aa8ecec91'
        required: false

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: RubyxLabs/android_kernel_xiaomi_mt6877
          ref: ${{ inputs.kernel_ref || 'be1aa8ecec91d1793024db1d7a88e621b74e633e' }}
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio kmod rsync zstd xz-utils gzip python3 perl \
            git curl ca-certificates dwarves ccache clang lld llvm
          # LLVM=1 needs unversioned tool names; Ubuntu ships them versioned.
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump \
                   llvm-readelf llvm-readobj llvm-strip llvm-size llvm-strings; do
            command -v "$t" >/dev/null && continue
            src=$(ls /usr/lib/llvm-*/bin/"$t" 2>/dev/null | head -n1 || true)
            if [ -n "$src" ]; then sudo ln -sf "$src" /usr/bin/"$t"; fi
          done
          clang --version | head -n1
          ld.lld --version | head -n1
          make --version | head -n1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-kernel-${{ inputs.kernel_ref || 'be1aa8ecec91d1793024db1d7a88e621b74e633e' }}-${{ github.sha }}
          restore-keys: |
            ccache-kernel-${{ inputs.kernel_ref || 'be1aa8ecec91d1793024db1d7a88e621b74e633e' }}-
            ccache-kernel-
            ccache-kernel-

      - name: Setup KernelSU-Next
        working-directory: kernel
        env:
          KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh
          if [ -n "${KSU_REF:-}" ]; then
            bash /tmp/ksu-setup.sh "${KSU_REF}"
          else
            bash /tmp/ksu-setup.sh
          fi
          test -d drivers/kernelsu || { echo "KernelSU tree not linked"; exit 1; }
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

      - name: Apply DroidSpaces SYSVIPC kABI patch
        working-directory: kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ inputs.kabi_slots || 'auto' }}
        run: |
          set -euo pipefail
          API="repos/ravindu644/Droidspaces-OSS/contents/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
          fetch_patch() {
            local want="$1" sha
            sha=$(gh api "$API" --jq ".[] | select(.name|test(\"fix_sysvipc_kabi_${want}\")) | .sha")
            [ -n "$sha" ] || { echo "no blob for slot variant $want"; return 1; }
            gh api "repos/ravindu644/Droidspaces-OSS/git/blobs/${sha}" --jq .content \
              | base64 -d > "/tmp/sysvipc-${want}.patch"
            test -s "/tmp/sysvipc-${want}.patch"
          }
          if [ "$VARIANT" = "auto" ]; then CANDIDATES="6_7_8 3_4_5 1_2_3"; else CANDIDATES="$VARIANT"; fi
          applied=""
          for v in $CANDIDATES; do
            [ "$v" = "none" ] && { echo "kABI patch skipped by input"; break; }
            fetch_patch "$v"
            if patch -p1 --dry-run -f < "/tmp/sysvipc-${v}.patch" >/dev/null 2>&1; then
              patch -p1 -f < "/tmp/sysvipc-${v}.patch"
              applied="$v"
              echo "applied kABI slot variant $v"
              break
            fi
            echo "variant $v does not apply (dry-run failed)"
          done
          if [ -z "$applied" ] && [ "$VARIANT" != "none" ]; then
            echo "::warning::No SYSVIPC kABI variant applied; SYSVIPC would break the GKI ABI"
          fi
          echo "KABI_VARIANT=${applied:-none}" >> "$GITHUB_ENV"

      - name: Fix same-directory include paths
        working-directory: kernel
        env:
          AUDIODSP: ${{ inputs.audiodsp || 'false' }}
        run: |
          set -euo pipefail
          F=sound/soc/mediatek/audio_dsp/v2/Makefile
          grep -qF 'I$(srctree)/sound/soc/mediatek/audio_dsp/v2' "$F" || \
            echo 'ccflags-y += -I$(srctree)/sound/soc/mediatek/audio_dsp/v2' >> "$F"
          if [ "$AUDIODSP" = "true" ]; then
            A=drivers/misc/mediatek/adsp/mt6853/Makefile
            grep -qF 'I$(srctree)/drivers/misc/mediatek/adsp/$(ADSP_PLATFORM)' "$A" || \
              echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/adsp/$(ADSP_PLATFORM)' >> "$A"
          fi

      - name: Vendor missing MTK iommu header
        working-directory: kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          H=drivers/iommu/mtk_iommu_ext.h
          if [ ! -f "$H" ]; then
            gh api "repos/crdroidandroid/android_kernel_xiaomi_mt6877/contents/$H?ref=16.0" \
              --jq '.content' | base64 -d > "$H"
            echo "vendored $H ($(wc -l < "$H") lines)"
          fi
          # mach/mt_iommu.h includes "mtk_iommu_ext.h"; in the vendor layout it lives
          # in drivers/iommu next to the MTK_IOMMU_V2 driver. This tree ships neither,
          # so the header also needs the pgtable-ext default its Kconfig would provide.
          if ! grep -q 'MTK_IOMMU_PGTABLE_EXT' drivers/iommu/Kconfig; then
            echo 'HEADER_DEFS=-DCONFIG_MTK_IOMMU_PGTABLE_EXT=32' >> "$GITHUB_ENV"
          fi
          grep -n 'MTK_IOMMU_PGTABLE_EXT' "$H" || true

      - name: Configure (ruby_defconfig + DroidSpaces + KSU)
        working-directory: kernel
        env:
          LOCALVERSION_INPUT: ${{ inputs.localversion }}
          AUDIODSP: ${{ inputs.audiodsp || 'false' }}
        run: |
          set -euo pipefail
          export ARCH=arm64 LLVM=1
          make ruby_defconfig
          if [ "$AUDIODSP" != "true" ]; then
            ./scripts/config --file .config -d MTK_AUDIODSP_SUPPORT -d SND_SOC_MTK_AUDIO_DSP
          fi
          ./scripts/config --file .config \
            -e SYSCTL -e SYSVIPC -e POSIX_MQUEUE \
            -e NAMESPACES -e PID_NS -e UTS_NS -e IPC_NS -e NET_NS -e USER_NS \
            -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e SECCOMP -e SECCOMP_FILTER \
            -e CGROUPS -e CGROUP_DEVICE -e CGROUP_PIDS -e CGROUP_SCHED \
            -e FAIR_GROUP_SCHED -e CFS_BANDWIDTH -e MEMCG -e BLK_CGROUP \
            -e OVERLAY_FS -e TMPFS_XATTR -e TMPFS_POSIX_ACL \
            -e EXT4_FS_POSIX_ACL -e EXT4_FS_SECURITY \
            -e VETH -e MACVLAN -e BRIDGE -e BRIDGE_NETFILTER -e TUN \
            -e IP6_NF_NAT -e IP6_NF_TARGET_MASQUERADE \
            -e KSU -d WERROR
          if [ -n "${LOCALVERSION_INPUT:-}" ]; then
            ./scripts/config --file .config --set-str LOCALVERSION "$LOCALVERSION_INPUT"
          fi
          make olddefconfig

          {
            for o in KSU SYSVIPC POSIX_MQUEUE IPC_NS PID_NS USER_NS UTS_NS NET_NS \
                     DEVTMPFS SECCOMP SECCOMP_FILTER OVERLAY_FS VETH BRIDGE TUN \
                     MACVLAN CGROUP_DEVICE CGROUP_PIDS CFS_BANDWIDTH MEMCG WERROR \
                     IP6_NF_NAT IP6_NF_TARGET_MASQUERADE \
                     MTK_AUDIODSP_SUPPORT SND_SOC_MTK_AUDIO_DSP; do
              grep -E "^CONFIG_${o}=" .config || echo "# CONFIG_${o} is not set (or absent)"
            done
            echo "LOCALVERSION=$(grep -E '^CONFIG_LOCALVERSION=' .config || true)"
          } | tee config-report.txt
          grep -q '^CONFIG_KSU=y' .config || { echo "CONFIG_KSU is not enabled"; exit 1; }

      - name: Pin kernel release string (no -dirty)
        working-directory: kernel
        run: |
          set -euo pipefail
          # scripts/setlocalversion appends -dirty because CI patches tracked files.
          # The ROM kernel is 6.6.143-android15-8-4k-Singularity-gbe1aa8ecec91 with no
          # -dirty suffix, and module loading needs an exact vermagic match.
          sed -i "s/printf '%s' -dirty/:/" scripts/setlocalversion
          if grep -q "printf '%s' -dirty" scripts/setlocalversion; then
            echo "::error::could not neutralise the -dirty suffix"
            exit 1
          fi
          echo "git HEAD (used for -g<hash>): $(git rev-parse --short=12 HEAD)"
          echo "localversion file: $(cat localversion)"

      - name: Build kernel Image (self-healing includes)
        working-directory: kernel
        run: |
          set -uo pipefail
          export ARCH=arm64 LLVM=1
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 3G || true
          FLAGS="-Wno-error ${HEADER_DEFS:-}"
          : > include-fixes.log
          ok=0
          df -h / > disk-before.txt || true
          for attempt in $(seq 1 25); do
            echo "===== attempt ${attempt}: KCFLAGS='${FLAGS}' ====="
            if make -j"$(nproc)" CC="ccache clang" KCFLAGS="$FLAGS" Image \
                 2>&1 | tee "build-attempt-${attempt}.log"; then
              ok=1; echo "build succeeded on attempt ${attempt}"; break
            fi
            hdrs=$(grep -ohE "'[^']+' file not found" "build-attempt-${attempt}.log" \
                    | sed -E "s/^'([^']+)' file not found$/\1/" | sort -u)
            if [ -z "${hdrs:-}" ]; then
              echo "::error::build failed without a missing-header diagnostic"
              tail -n 60 "build-attempt-${attempt}.log"
              exit 1
            fi
            added=0
            while IFS= read -r hdr; do
              [ -z "$hdr" ] && continue
              echo "missing header: ${hdr}"
              # Prefer a platform directory (mt6853/mt6877) when the name repeats.
              mapfile -t hits < <(find . -name "$hdr" -not -path './.git/*' -not -path './out/*' 2>/dev/null)
              if [ "${#hits[@]}" -eq 0 ]; then
                echo "::error::header '${hdr}' does not exist in the source tree"
                exit 1
              fi
              pick=""
              for h in "${hits[@]}"; do
                case "$h" in *mt6853*|*mt6877*) pick=$(dirname "$h"); break;; esac
              done
              [ -n "$pick" ] || pick=$(dirname "${hits[0]}")
              case " $FLAGS " in
                *" -I$PWD/$pick "*) echo "  already in KCFLAGS: $pick"; continue;;
              esac
              FLAGS="$FLAGS -I$PWD/$pick"
              added=$((added + 1))
              echo "  adding include dir: $pick" | tee -a include-fixes.log
            done <<< "$hdrs"
            if [ "$added" -eq 0 ]; then
              echo "::error::no new include dir could be added, build is stuck"
              tail -n 60 "build-attempt-${attempt}.log"
              exit 1
            fi
            df -h / | tail -n1
          done
          cp "build-attempt-${attempt}.log" build.log
          [ "$ok" -eq 1 ] || { echo "::error::no green build after ${attempt} attempts"; exit 1; }
          ls -lh arch/arm64/boot/Image

      - name: Verify build result
        working-directory: kernel
        env:
          EXPECTED_RELEASE: ${{ inputs.expected_release || '6.6.143-android15-8-4k-Singularity-gbe1aa8ecec91' }}
        run: |
          set -euo pipefail
          test -s arch/arm64/boot/Image
          file arch/arm64/boot/Image
          sha256sum arch/arm64/boot/Image | tee Image.sha256
          echo "include dirs added: $(wc -l < include-fixes.log || echo 0)"
          release=$(strings -a arch/arm64/boot/Image | grep -m1 -E '^6\.[0-9]+\.[0-9]+[^ ]* SMP' | sed 's/ SMP.*//')
          echo "built release:    ${release}"
          echo "expected release: ${EXPECTED_RELEASE}"
          echo "RELEASE=${release}" >> "$GITHUB_ENV"
          if [ "$release" != "$EXPECTED_RELEASE" ]; then
            echo "::error::kernel release '$release' does not match the ROM '$EXPECTED_RELEASE'"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            kernel/arch/arm64/boot/Image
            kernel/Image.sha256
            kernel/.config
            kernel/config-report.txt
            kernel/build.log
            kernel/build-attempt-*.log
            kernel/include-fixes.log
